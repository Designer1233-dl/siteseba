<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111216"><meta http-equiv="Cache-Control" content="no-store"><title>Пропал из Интернета</title><style>

ckground:#26272d;display:grid;place-items:center;font-size:22px}.story small{display:block;font-size:10px;margin-top:5px}.storyNote{font-size:11px;color:#858690}.list{flex:1;overflow:auto;padding:5px}.row{min-height:72px;padding:8px 9px;border-radius:14px;display:flex;align-items:center;gap:11px;cursor:pointer}.row:hover{background:#202126}.row .avatar{width:54px;height:54px;font-size:19px}.ri{flex:1;min-width:0}.line{display:flex;justify-content:space-between;gap:10px;align-items:center}.line b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.line time{font-size:11px;color:#8c8d96}.preview{font-size:13px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:10px;color:#ff7788;background:#351820;border-radius:9px;padding:4px 7px}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:28px}.empty i{width:72px;height:72px;border-radius:50%;background:#2a171d;color:#ff6072;display:grid;place-items:center;font-size:30px;font-style:normal;margin:auto auto 13px}.empty h3{margin:0 0 6px;font-size:17px}.empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.fab{position:absolute;left:300px;bottom:22px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-size:26px;box-shadow:0 9px 24px #c7193e66}.main{min-width:0;display:flex;flex-direction:column;background:#0d0e12}.head{height:68px;display:flex;align-items:center;gap:11px;padding:0 16px;background:#18191e;border-bottom:1px solid var(--line)}.back{display:none}.head .avatar{width:46px;height:46px}.headInfo{flex:1;min-width:0}.headInfo b{display:block;font-size:17px}.headInfo small{display:block;margin-top:3px;color:#a1a2aa;font-size:13px}.messages{flex:1;overflow:auto;padding:14px max(5%,12px);background-image:radial-gradient(#2a2024 1px,transparent 1px);background-size:21px 21px;display:flex;flex-direction:column;justify-content:flex-end}.day{align-self:center;background:#292a30;color:#bbb;border-radius:11px;padding:4px 9px;font-size:11px;margin:4px 0 9px}.bubble{align-self:flex-start;width:max-content;max-width:min(74%,620px);background:#23242a;border-radius:16px 16px 16px 5px;padding:9px 12px 7px;margin:2px 0;font-size:17px;line-height:1.28;word-break:break-word}.bubble.me{align-self:flex-end;background:linear-gradient(135deg,#501b29,#361a23);border-radius:16px 16px 5px 16px}.bubbleMeta{font-size:10px;color:#b38f98;margin-left:9px;white-space:nowrap;float:right;margin-top:7px}.emptyChat{margin:auto;align-self:center;background:#292a30;color:#bbb;border-radius:13px;padding:8px 12px;font-size:12px}.composer{min-height:70px;display:none;align-items:center;gap:7px;padding:9px 13px calc(9px + env(safe-area-inset-bottom));background:#18191e;border-top:1px solid var(--line)}.composer.on{display:flex}.composer input{height:49px;flex:1;min-width:0;border:1px solid #303139;outline:0;border-radius:17px;background:#23242a;color:#fff;padding:0 16px;font-size:17px}.composer input:focus{border-color:#a72c41}.send{width:49px;height:49px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-size:20px}.status{font-size:11px;color:#ff7181;padding:0 8px}.cover{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 20% 0,#40121d,transparent 35%),#0b0c0f;display:grid;place-items:center;padding:16px}.auth{width:min(410px,100%);background:#18191e;border:1px solid #2f3037;border-radius:25px;padding:29px;box-shadow:0 30px 90px #000}.logo{width:62px;height:62px;border-radius:21px;background:linear-gradient(135deg,var(--red),var(--red2));display:grid;place-items:center;font-size:26px;font-weight:900;margin-bottom:19px}.auth h1{font-size:26px;margin:0 0 7px}.auth>p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px}.switch{display:grid;grid-template-columns:1fr 1fr;background:#24252a;border-radius:12px;padding:4px;margin-bottom:14px}.switch button{height:37px;border-radius:9px;background:none;color:#999;font-weight:650}.switch button.on{background:#37383f;color:#ff7485}.field{margin:10px 0}.field label{display:block;color:#aaa;font-size:10px;font-weight:800;margin:0 0 5px 3px}.field input{width:100%;height:47px;border:1px solid #34353c;outline:0;border-radius:12px;background:#222329;color:#fff;padding:0 13px;font-size:16px}.field input:focus{border-color:var(--red)}.primary{width:100%;height:47px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:750;margin-top:8px}.error{min-height:16px;text-align:center;color:#ff6b7c;font-size:11px;margin-top:9px}.modalLayer{position:fixed;inset:0;z-index:40;background:#000a;display:grid;place-items:center;padding:14px}.modal{width:min(420px,100%);background:#1a1b20;border:1px solid #303139;border-radius:22px;padding:21px}.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.modalHead h2{font-size:20px;margin:0}.close{width:35px;height:35px;border-radius:50%;background:#292a30;color:#bbb;font-size:19px}.choice{width:100%;display:flex;align-items:center;gap:12px;padding:11px 5px;border-radius:12px;background:none;color:#fff;text-align:left}.choice:hover{background:#24252a}.choiceIcon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#411824;color:#ff7181}.choice b{display:block}.choice small{display:block;color:#91929c;margin-top:3px}.avatarPick{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#311820;color:#ff6375;font-size:28px;overflow:hidden}.avatarPick img{width:100%;height:100%;object-fit:cover}.toast{position:fixed;z-index:60;left:50%;bottom:85px;transform:translateX(-50%);background:#282930;color:#fff;border:1px solid #3a3b43;border-radius:12px;padding:10px 14px;font-size:12px}
@media(max-width:700px){.app{display:block}.side{height:100dvh;border:0}.main{display:none;height:100dvh}.main.open{display:flex}.side.off{display:none}.top{padding-top:calc(11px + env(safe-area-inset-top))}.brand h1{font-size:22px}.fab{position:fixed;left:auto;right:17px;bottom:calc(18px + env(safe-area-inset-bottom))}.head{height:calc(64px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);padding-left:6px}.back{display:grid;width:39px;height:39px;border-radius:50%;place-items:center;background:none;color:#ccc;font-size:26px}.head .avatar{width:46px;height:46px}.messages{padding:9px 8px 7px}.bubble{font-size:18px;line-height:1.24;max-width:86%;padding:9px 12px 7px;margin:2px 0}.bubbleMeta{font-size:11px}.composer{min-height:72px;padding-left:9px;padding-right:9px}.composer input{height:50px;font-size:18px}.send{width:50px;height:50px}.cover{padding:0;align-items:start}.auth{width:100%;min-height:100dvh;border:0;border-radius:0;box-shadow:none;padding:calc(32px + env(safe-area-inset-top)) 23px 23px}.logo{margin:0 auto 19px}.auth h1,.auth>p{text-align:center}.modalLayer{padding:0;align-items:end}.modal{width:100%;border-radius:22px 22px 0 0;padding:20px 17px calc(22px + env(safe-area-inset-bottom))}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="top"><button class="avatar" id="profile">П</button><label class="search"><span>⌕</span><input id="search" placeholder="Найти по @username"></label><button class="icon" id="refresh">↻</button></div><div class="brand"><h1>Пропал из Интернета</h1><small>BUILD 7</small></div><div class="stories"><button class="story" id="myStory"><div class="storyRing"><div class="storyFace">＋</div></div><small>Моя история</small></button><span class="storyNote">Диалоги появляются только после поиска</span></div><div class="list" id="list"></div><button class="fab" id="fab">＋</button></aside><main class="main" id="main"><header class="head"><button class="back" id="back">‹</button><div class="avatar" id="headAvatar">П</div><div class="headInfo"><b id="headName">Пропал из Интернета</b><small id="headSub">выберите диалог</small></div><button class="icon">⋮</button></header><section class="messages" id="messages"><div class="emptyChat">Выберите диалог</div></section><form class="composer" id="composer"><button type="button" class="icon">＋</button><input id="message" autocomplete="off" placeholder="Сообщение"><button class="send">➤</button></form></main></div><div class="cover" id="auth"><div class="auth"><div class="logo">П</div><h1 id="authTitle">Создать аккаунт</h1><p id="authText">Общение без лишнего шума.</p><div class="switch"><button data-mode="login">Вход</button><button class="on" data-mode="register">Регистрация</button></div><div class="field reg"><label>ИМЯ</label><input id="name" placeholder="Как тебя зовут?"></div><div class="field"><label>USERNAME</label><input id="user" placeholder="username"></div><div class="field"><label>ПАРОЛЬ</label><input id="pass" type="password" placeholder="Минимум 8 символов"></div><button class="primary" id="authGo">Создать аккаунт</button><div class="error" id="authError"></div></div></div><script>
'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],TK='lost-token',PK='lost-profile';let token=localStorage.getItem(TK)||'',mode='register',active=null,eventCursor=Date.now(),eventRunning=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);opt.signal=opt.signal||c.signal;opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body)opt.headers['Content-Type']='application/json';try{let r=await fetch(url,opt),v;try{v=await r.json()}catch{throw Error('Сервер вернул неправильный ответ')}if(!r.ok)throw Error(v.error||'Ошибка сервера');return v}catch(e){if(e.name==='AbortError')throw Error('Сервер не отвечает');throw e}finally{clearTimeout(t)}}function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}function showAuth(){if(!$('#auth'))location.reload()}function setMode(m){mode=m;$$('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));$('.reg').classList.toggle('hide',m==='login');$('#authTitle').textContent=m==='login'?'С возвращением':'Создать аккаунт';$('#authText').textContent=m==='login'?'Введи данные для входа.':'Общение без лишнего шума.';$('#authGo').textContent=m==='login'?'Войти':'Создать аккаунт';$('#authError').textContent=''}$$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#authGo').onclick=async()=>{let name=$('#name').value.trim(),username=$('#user').value.trim().replace(/^@/,'').toLowerCase(),password=$('#pass').value,e=$('#authError'),btn=$('#authGo');if(!/^[a-z][a-z0-9_]{4,31}$/.test(username))return e.textContent='Username: латиница, цифры и _ — от 5 символов';if(password.length<8)return e.textContent='Пароль: минимум 8 символов';if(mode==='register'&&!name)return e.textContent='Введите имя';btn.disabled=true;e.textContent='';try{let v=await api(mode==='register'?'/api/register':'/api/login',{method:'POST',body:JSON.stringify(mode==='register'?{name,username,password}:{username,password})});token=v.token;localStorage.setItem(TK,token);localStorage.setItem(PK,JSON.stringify(v.user));$('#auth').remove();paintProfile();await syncDialogs();startEvents()}catch(x){e.textContent=x.message}finally{btn.disabled=false}};
function paintProfile(){let p=JSON.parse(localStorage.getItem(PK)||'{}');$('#profile').innerHTML=p.avatar?`<img src="${p.avatar}">`:esc((p.name||'П')[0].toUpperCase())}async function validate(){if(!token)return;try{let v=await api('/api/me');localStorage.setItem(PK,JSON.stringify(v.user));$('#auth')?.remove();paintProfile();await syncDialogs();startEvents()}catch{token='';localStorage.removeItem(TK);localStorage.removeItem(PK);showAuth()}}function empty(title,text,icon='⌕'){$('#list').innerHTML=`<div class="empty"><div><i>${icon}</i><h3>${title}</h3><p>${text}</p></div></div>`}async function syncDialogs(){if(!token)return;$('#composer').classList.toggle('on',!!active);try{let v=await api('/api/conversations');if(!v.conversations.length)return empty('Пока нет диалогов','Введи точный @username в поиске сверху.');$('#list').innerHTML=v.conversations.map(x=>`<div class="row dialog" data-user="${esc(x.user.username)}"><div class="avatar">${x.user.avatar?`<img src="${x.user.avatar}">`:esc(x.user.name[0])}</div><div class="ri"><div class="line"><b>${esc(x.user.name)}</b><time>${new Date(x.last.createdAt).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</time></div><div class="preview">${esc(x.last.text)}</div></div></div>`).join('');$$('.dialog').forEach(r=>r.onclick=()=>openChat(r.dataset.user))}catch(x){if(x.message==='Нужно войти')logout();else empty('Нет связи',x.message,'!')}}
let searchTimer;$('#search').oninput=e=>{clearTimeout(searchTimer);let q=e.target.value.trim().replace(/^@/,'');if(q.length<2)return syncDialogs();searchTimer=setTimeout(()=>findUsers(q),180)};async function findUsers(q){try{let v=await api('/api/users?q='+encodeURIComponent(q));if(!v.users.length)return empty('Никого не нашли','Проверь написание username.');$('#list').innerHTML=v.users.map(u=>`<div class="row person" data-user="${esc(u.username)}"><div class="avatar">${u.avatar?`<img src="${u.avatar}">`:esc(u.name[0])}</div><div class="ri"><div class="line"><b>${esc(u.name)}</b><span class="tag">@${esc(u.username)}</span></div><div class="preview">${esc(u.bio||'Пользователь')}</div></div></div>`).join('');$$('.person').forEach(r=>r.onclick=()=>openChat(r.dataset.user))}catch(x){empty('Ошибка поиска',x.message,'!')}}function mobileOpen(){if(innerWidth<=700){$('#side').classList.add('off');$('#main').classList.add('open')}}function clearChat(){active=null;$('#composer').classList.remove('on');$('#headName').textContent='Пропал из Интернета';$('#headSub').textContent='выберите диалог';$('#headAvatar').textContent='П';$('#messages').innerHTML='<div class="emptyChat">Выберите диалог</div>'}$('#back').onclick=()=>{$('#side').classList.remove('off');$('#main').classList.remove('open');clearChat();syncDialogs()};async function openChat(username){active=username;$('#composer').classList.add('on');$('#headName').textContent='Загрузка…';$('#headSub').textContent='@'+username;$('#messages').innerHTML='<div class="emptyChat">Загрузка…</div>';mobileOpen();await loadMessages()}
async function loadMessages(){if(!active)return;try{let v=await api('/api/messages?with='+encodeURIComponent(active));$('#headName').textContent=v.user.name;$('#headSub').textContent='@'+v.user.username;$('#headAvatar').innerHTML=v.user.avatar?`<img src="${v.user.avatar}">`:esc(v.user.name[0]);$('#messages').innerHTML=v.messages.length?'<div class="day">Сегодня</div>'+v.messages.map(m=>`<div class="bubble ${m.mine?'me':''}">${esc(m.text)}<span class="bubbleMeta">${new Date(m.createdAt).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}${m.mine?' ✓✓':''}</span></div>`).join(''):'<div class="emptyChat">Начало общения</div>';$('#messages').scrollTop=$('#messages').scrollHeight}catch(x){$('#headName').textContent='Чат недоступен';$('#headSub').textContent='@'+active;$('#headAvatar').textContent=((active||'П')[0]||'П').toUpperCase();$('#messages').innerHTML='<div class="emptyChat">Не удалось открыть диалог</div>';toast(x.message)}}$('#composer').onsubmit=async e=>{e.preventDefault();let input=$('#message'),text=input.value.trim();if(!active)return toast('Сначала выбери диалог');if(!text)return;input.value='';let optimistic=document.createElement('div');optimistic.className='bubble me';optimistic.innerHTML=esc(text)+'<span class="bubbleMeta">отправка…</span>';$('#messages').appendChild(optimistic);$('#messages').scrollTop=$('#messages').scrollHeight;try{await api('/api/messages',{method:'POST',body:JSON.stringify({to:active,text})});await loadMessages();await syncDialogs()}catch(x){optimistic.querySelector('.bubbleMeta').textContent='не отправлено';input.value=text;toast(x.message)}};
async function startEvents(){if(eventRunning||!token)return;eventRunning=true;while(eventRunning&&token){try{let v=await api('/api/events?since='+eventCursor);eventCursor=v.cursor||eventCursor;if(v.changed){if(active)await loadMessages();await syncDialogs()}}catch(x){if(x.message==='Нужно войти'){logout();return}await new Promise(r=>setTimeout(r,1000))}}}function logout(){token='';eventRunning=false;active=null;localStorage.removeItem(TK);localStorage.removeItem(PK);location.reload()}$('#refresh').onclick=async()=>{await syncDialogs();if(active)await loadMessages();toast('Обновлено')};function modal(html){let l=document.createElement('div');l.className='modalLayer';l.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(l);l.onclick=e=>{if(e.target===l)l.remove()};l.querySelector('.close')?.addEventListener('click',()=>l.remove());return l}$('#fab').onclick=()=>{let l=modal('<div class="modalHead"><h2>Новое</h2><button class="close">×</button></div><button class="choice"><span class="choiceIcon">⌕</span><span><b>Найти человека</b><small>Поиск по уникальному username</small></span></button>');l.querySelector('.choice').onclick=()=>{l.remove();$('#search').focus()}};$('#profile').onclick=()=>{let p=JSON.parse(localStorage.getItem(PK)||'{}'),l=modal(`<div class="modalHead"><h2>Профиль</h2><button class="close">×</button></div><label class="avatarPick">${p.avatar?`<img src="${p.avatar}">`:'＋'}</label><input type="file" hidden accept="image/*"><div class="field"><label>ИМЯ</label><input class="pn" value="${esc(p.name||'')}"></div><div class="field"><label>USERNAME</label><input class="pu" value="${esc(p.username||'')}"></div><button class="primary save">Сохранить</button><div class="error"></div>`),file=l.querySelector('[type=file]');l.querySelector('.avatarPick').onclick=()=>file.click();file.onchange=()=>{if(!file.files[0])return;let r=new FileReader;r.onload=()=>{p.avatar=r.result;l.querySelector('.avatarPick').innerHTML=`<img src="${r.result}">`};r.readAsDataURL(file.files[0])};l.querySelector('.save').onclick=async()=>{try{let v=await api('/api/me',{method:'PATCH',body:JSON.stringify({name:l.querySelector('.pn').value,username:l.querySelector('.pu').value,avatar:p.avatar||''})});localStorage.setItem(PK,JSON.stringify(v.user));paintProfile();l.remove()}catch(x){l.querySelector('.error').textContent=x.message}}};$('#myStory').onclick=()=>toast('Истории появятся в следующем обновлении');paintProfile();validate();if(!token)setMode('register');
</script></body></html>
