<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],AK='seva-top-account',DK='seva-top-data';const directory=[{name:'Алина Морозова',user:'alina_m',color:'purple',bio:'Дизайнер · была недавно'},{name:'Максим Орлов',user:'max_orlov',color:'orange',bio:'Музыка и путешествия'},{name:'Лера Ким',user:'lera_kim',color:'green',bio:'Фотограф · в сети'},{name:'Сева',user:'seva_official',color:'',bio:'Автор Сайт‑Севы'}];const initial={chats:[],groups:[],channels:[{id:'c1',name:'Сева Новости',user:'seva_news',desc:'Главные новости и обновления проекта.',joined:false,posts:[{id:1,text:'Добро пожаловать! Здесь выходят новости Сайт‑Севы и анонсы новых функций.',time:'14:20',r:{'🔥':28,'❤️':17,'👍':12}},{id:2,text:'Теперь можно создавать группы, каналы и ставить реакции публикациям ✨',time:'15:04',r:{'🎉':21,'👍':8}}]},{id:'c2',name:'Музыка каждый день',user:'daily_music',desc:'Свежие треки и подборки для настроения.',joined:false,posts:[{id:1,text:'Вечерняя подборка уже готова. Надевайте наушники 🎧',time:'18:30',r:{'❤️':42,'🎧':25}}]}]};let data=JSON.parse(localStorage.getItem(DK)||'null')||initial,tab='chats',current=null,authMode='register';const save=()=>localStorage.setItem(DK,JSON.stringify(data));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function refreshProfile(){let a=JSON.parse(localStorage.getItem(AK)||'{}');$('#profileBtn').innerHTML=a.avatar?`<img src="${a.avatar}">`:esc((a.name||'С')[0].toUpperCase())}function empty(title,text,icon='✦'){$('#list').innerHTML=`<div class="empty"><div><div class="emptyIcon">${icon}</div><h3>${title}</h3><p>${text}</p></div></div>`}function render(){let rows=[];$('#title').textContent=tab==='channels'?'Каналы':tab==='friends'?'Люди':tab==='groups'?'Группы':'Чаты';if(tab==='channels')rows=data.channels.map(x=>({kind:'channel',...x,sub:x.joined?'Вы подписаны':'@'+x.user}));else if(tab==='groups')rows=data.groups.map(x=>({kind:'group',...x,sub:x.members.length+' участников'}));else if(tab==='chats')rows=data.chats.map(x=>({kind:'chat',...x,sub:x.messages?.at(-1)?.text||'Начните общение'}));if(tab==='friends')return empty('Поиск людей','Введи username в строку сверху — результаты появятся сразу.','⌕');if(!rows.length)return empty(tab==='chats'?'Пока нет чатов':'Здесь пока пусто',tab==='chats'?'Найди человека по @username или создай группу.':'Нажми +, чтобы создать первое сообщество.');$('#list').innerHTML=rows.map(x=>`<div class="row" data-kind="${x.kind}" data-id="${x.id}"><div class="ava ${x.kind==='channel'?'purple':''}">${esc(x.name[0].toUpperCase())}</div><div class="rowInfo"><div class="line"><b>${esc(x.name)}</b><time>${x.joined?'✓':''}</time></div><div class="sub">${esc(x.sub)}</div></div></div>`).join('');$$('.row').forEach(r=>r.onclick=()=>open(r.dataset.kind,r.dataset.id))}$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));$('#searchInput').value='';render()});
$('#searchInput').oninput=e=>{let q=e.target.value.trim().replace(/^@/,'').toLowerCase();if(!q)return render();let found=directory.filter(x=>x.user.includes(q)||x.name.toLowerCase().includes(q));$('#title').textContent='Результаты';$('#list').innerHTML=found.length?found.map(x=>`<div class="row person" data-user="${x.user}"><div class="ava ${x.color}">${x.name[0]}</div><div class="rowInfo"><div class="line"><b>${esc(x.name)}</b><span class="blue">@${esc(x.user)}</span></div><div class="sub">${esc(x.bio)}</div></div></div>`).join(''):`<div class="empty"><div><div class="emptyIcon">⌕</div><h3>Ничего не найдено</h3><p>Проверь написание username.</p></div></div>`;$$('.person').forEach(r=>r.onclick=()=>{let p=directory.find(x=>x.user===r.dataset.user),c=data.chats.find(x=>x.user===p.user);if(!c){c={id:'u'+Date.now(),name:p.name,user:p.user,messages:[]};data.chats.unshift(c);save()}open('chat',c.id)})};
function showMain(){if(innerWidth<=700){$('#side').classList.add('off');$('#main').classList.add('open')}}$('#back').onclick=()=>{$('#side').classList.remove('off');$('#main').classList.remove('open')};function open(kind,id){let obj=kind==='channel'?data.channels.find(x=>x.id===id):kind==='group'?data.groups.find(x=>String(x.id)===id):data.chats.find(x=>String(x.id)===id);current={kind,id};$('#headName').textContent=obj.name;$('#headAva').textContent=obj.name[0].toUpperCase();$('#headAva').className='ava '+(kind==='channel'?'purple':'');$('#composer').classList.toggle('on',kind!=='channel');if(kind==='channel'){renderChannel(obj);$('#headSub').textContent='@'+obj.user}else{renderChat(obj);$('#headSub').textContent=kind==='group'?obj.members.length+' участников':'@'+obj.user}showMain()}
function renderChat(x){let msgs=x.messages||[];$('#messages').innerHTML=msgs.length?msgs.map(m=>`<div class="bubble me">${esc(m.text)}<small>${m.time} ✓✓</small></div>`).join(''):'<div class="blank"><div class="glass">👋<strong>Начало общения</strong><small>Напиши первое сообщение</small></div></div>';$('#messages').scrollTop=$('#messages').scrollHeight}$('#composer').onsubmit=e=>{e.preventDefault();let v=$('#msg').value.trim();if(!v||!current)return;let arr=current.kind==='group'?data.groups:data.chats,x=arr.find(o=>String(o.id)===String(current.id));x.messages=x.messages||[];x.messages.push({text:v,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});$('#msg').value='';save();renderChat(x);render()};function renderChannel(c){$('#messages').innerHTML=`<div class="channelCard"><div class="ava purple">${esc(c.name[0])}</div><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p><button class="join ${c.joined?'on':''}">${c.joined?'Вы подписаны':'Подписаться'}</button></div>`+(c.posts.length?c.posts.map(p=>`<article class="post"><div class="postAuthor">${esc(c.name)}</div><p>${esc(p.text)}</p><div class="reacts">${Object.entries(p.r).map(([em,n])=>`<button class="react ${p.mine===em?'on':''}" data-p="${p.id}" data-e="${em}">${em} ${n}</button>`).join('')}<button class="react addReact" data-p="${p.id}">＋</button></div><div class="postMeta">${p.time}</div></article>`).join(''):'<div class="post">Публикаций пока нет</div>');$('.join').onclick=()=>{c.joined=!c.joined;save();renderChannel(c);render()};$$('.react[data-e]').forEach(b=>b.onclick=()=>{let p=c.posts.find(x=>x.id==b.dataset.p),em=b.dataset.e;if(p.mine===em){p.r[em]--;delete p.mine}else{if(p.mine)p.r[p.mine]--;p.r[em]++;p.mine=em}save();renderChannel(c)});$$('.addReact').forEach(b=>b.onclick=()=>reactionPicker(c,b.dataset.p))}
function modal(html){let l=document.createElement('div');l.className='modalLayer';l.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(l);l.onclick=e=>{if(e.target===l)l.remove()};l.querySelector('.close')?.addEventListener('click',()=>l.remove());return l}function createMenu(){let l=modal('<div class="modalTop"><h2>Создать</h2><button class="close">×</button></div><button class="choice" data-c="group"><span class="choiceIcon">♟</span><span><b>Новая группа</b><small>Общение с друзьями</small></span></button><button class="choice" data-c="channel"><span class="choiceIcon">◉</span><span><b>Новый канал</b><small>Публикации для подписчиков</small></span></button><button class="choice" data-c="message"><span class="choiceIcon">✎</span><span><b>Новое сообщение</b><small>Найти человека по username</small></span></button>');l.querySelector('[data-c=message]').onclick=()=>{l.remove();tab='friends';render();$('#searchInput').focus()};l.querySelector('[data-c=group]').onclick=()=>creator('group',l);l.querySelector('[data-c=channel]').onclick=()=>creator('channel',l)}$('#fab').onclick=createMenu;
function creator(kind,old){old.remove();let l=modal(`<div class="modalTop"><h2>${kind==='group'?'Новая группа':'Новый канал'}</h2><button class="close">×</button></div><div class="avatarPick">＋</div><div class="field"><label>НАЗВАНИЕ</label><input class="createName" placeholder="Введите название"></div>${kind==='channel'?'<div class="field"><label>USERNAME КАНАЛА</label><input class="createUser" placeholder="my_channel"></div><div class="field"><label>ОПИСАНИЕ</label><textarea class="createDesc" rows="3" placeholder="О чём ваш канал?"></textarea></div>':'<div class="field"><label>УЧАСТНИКИ</label><div class="members"><span class="member">@alina_m</span><span class="member">@max_orlov</span></div></div>'}<button class="primary createGo">Создать</button><div class="err"></div>`);l.querySelector('.createGo').onclick=()=>{let n=l.querySelector('.createName').value.trim(),err=l.querySelector('.err');if(!n)return err.textContent='Введите название';if(kind==='group'){let g={id:Date.now(),name:n,members:['Вы','Алина','Максим'],messages:[]};data.groups.unshift(g);save();tab='groups';render();l.remove();open('group',String(g.id))}else{let u=l.querySelector('.createUser').value.trim().replace(/^@/,'').toLowerCase(),d=l.querySelector('.createDesc').value.trim();if(!/^[a-z][a-z0-9_]{4,31}$/.test(u))return err.textContent='Введите корректный username';let c={id:'c'+Date.now(),name:n,user:u,desc:d||'Новый канал',joined:true,posts:[]};data.channels.unshift(c);save();tab='channels';render();l.remove();open('channel',c.id)}}}
function reactionPicker(c,id){let l=modal('<div class="modalTop"><h2>Реакция</h2><button class="close">×</button></div><div style="display:flex;gap:10px;font-size:28px;justify-content:center"><button>❤️</button><button>🔥</button><button>👍</button><button>🎉</button><button>😂</button></div>');[...l.querySelectorAll('.modal>div:last-child button')].forEach(b=>b.onclick=()=>{let p=c.posts.find(x=>x.id==id),em=b.textContent;p.r[em]=(p.r[em]||0)+1;p.mine=em;save();l.remove();renderChannel(c)})}
function profile(){let a=JSON.parse(localStorage.getItem(AK)||'{}'),l=modal(`<div class="modalTop"><h2>Профиль</h2><button class="close">×</button></div><label class="avatarPick">${a.avatar?`<img src="${a.avatar}">`:'＋'}</label><input type="file" hidden accept="image/*"><div class="field"><label>ИМЯ</label><input class="pName" value="${esc(a.name||'')}"></div><div class="field"><label>USERNAME</label><input class="pUser" value="${esc(a.user||'')}"></div><button class="primary pSave">Сохранить</button><div class="err"></div>`);let f=l.querySelector('[type=file]');l.querySelector('.avatarPick').onclick=()=>f.click();f.onchange=()=>{if(!f.files[0])return;let r=new FileReader;r.onload=()=>{a.avatar=r.result;l.querySelector('.avatarPick').innerHTML=`<img src="${r.result}">`};r.readAsDataURL(f.files[0])};l.querySelector('.pSave').onclick=()=>{let n=l.querySelector('.pName').value.trim(),u=l.querySelector('.pUser').value.trim().replace(/^@/,'').toLowerCase();if(!n||!/^[a-z][a-z0-9_]{4,31}$/.test(u))return l.querySelector('.err').textContent='Проверь имя и username';a.name=n;a.user=u;localStorage.setItem(AK,JSON.stringify(a));refreshProfile();l.remove()}}$('#profileBtn').onclick=profile;$('#channelsBtn').onclick=()=>{tab='channels';$$('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab==='channels'));render()};refreshProfile();render();$('#messages').innerHTML='<div class="blank"><div class="glass">✈<strong>Сайт‑Севы</strong><small>Выбери чат, группу или канал</small></div></div>';
</script><script>
document.title='Пропал из Интернета';
const brandText=document.querySelector('.premium');if(brandText)brandText.textContent='ПРОПАЛ ИЗ ИНТЕРНЕТА';const head=document.querySelector('.headText b');if(head)head.textContent='Пропал из Интернета';
function storiesLayer(){let l=document.createElement('div');l.className='modalLayer';l.innerHTML='<div class="modal storyModal"><div class="modalTop"><h2>Истории</h2><button class="close">×</button></div><div class="storyGrid"><button data-s="Моя история">＋<small>Моя история</small></button><button data-s="Алина Морозова">А<small>Алина</small></button><button data-s="Максим Орлов">М<small>Максим</small></button><button data-s="Лера Ким">Л<small>Лера</small></button></div><p class="storyHint">Истории исчезают через 24 часа · 0 просмотров</p></div>';document.body.appendChild(l);l.querySelector('.close').onclick=()=>l.remove();l.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const name=b.dataset.s;const v=document.createElement('div');v.className='modalLayer storyView';v.innerHTML=`<div class="storyFull"><button class="storyClose">×</button><div class="storyAvatar">${name[0]}</div><h2>${name}</h2><p>${name==='Моя история'?'Поделись моментом с друзьями ✨':'Сейчас в истории'}</p><div class="storyBar">♡ 　Ответить</div></div>`;document.body.appendChild(v);v.querySelector('.storyClose').onclick=()=>v.remove()})}
const storyBtn=document.createElement('button');storyBtn.className='storyPill';storyBtn.textContent='◉  Истории';storyBtn.onclick=storiesLayer;const titlebar=document.querySelector('.titlebar');if(titlebar)titlebar.parentNode.insertBefore(storyBtn,titlebar.nextSibling);
</script></body></html>
