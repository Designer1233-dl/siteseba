function profileIcon(){let a=JSON.parse(localStorage.getItem(AK)||'{}');$('#profile').innerHTML=a.avatar?`<img src="${a.avatar}">`:esc((a.name||'П')[0])}function empty(t,p,i='✦'){$('#list').innerHTML=`<div class="empty"><div><i>${i}</i><h3>${t}</h3><p>${p}</p></div></div>`}function render(){let a=[];if(tab==='chats')a=d.chats;else if(tab==='groups')a=d.groups;else if(tab==='channels')a=d.channels;if(tab==='people')return empty('Найди человека','Введи точный @username в строку поиска.','⌕');if(!a.length)return empty('Здесь пока пусто','Найди человека или создай новое сообщество.');$('#list').innerHTML=a.map(x=>`<div class="row" data-id="${x.id}" data-kind="${tab==='channels'?'channel':tab==='groups'?'group':'chat'}"><div class="avatar ${tab==='channels'?'purple':''}">${esc(x.name[0])}</div><div class="ri"><div class="rl"><b>${esc(x.name)}</b><time>${x.pinned?'📌':''}</time></div><div class="preview">${esc(x.user?'@'+x.user:x.members?.length+' участников')}</div></div></div>`).join('');$$('.row').forEach(r=>r.onclick=()=>open(r.dataset.kind,r.dataset.id))}$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));$('#search').value='';render()});

$('#search').oninput=e=>{let q=e.target.value.trim().replace(/^@/,'').toLowerCase();if(!q)return render();let f=people.filter(x=>x.user.includes(q)||x.name.toLowerCase().includes(q));$('#list').innerHTML=f.length?f.map(x=>`<div class="row person" data-user="${x.user}"><div class="avatar ${x.c}">${x.name[0]}</div><div class="ri"><div class="rl"><b>${esc(x.name)}</b><span style="color:var(--a);font-size:12px">@${x.user}</span></div><div class="preview">${x.bio}</div></div></div>`).join(''):'<div class="empty"><div><i>⌕</i><h3>Не найдено</h3><p>Проверь username.</p></div></div>';$$('.person').forEach(r=>r.onclick=()=>{let p=people.find(x=>x.user===r.dataset.user),c=d.chats.find(x=>x.user===p.user);if(!c){c={id:'u'+Date.now(),name:p.name,user:p.user,messages:[],pinned:false};d.chats.unshift(c);save()}open('chat',c.id)})};function mobileOpen(){if(innerWidth<=700){$('#side').classList.add('off');$('#main').classList.add('open')}}$('#back').onclick=()=>{$('#side').classList.remove('off');$('#main').classList.remove('open')};function open(kind,id){let x=kind==='channel'?d.channels.find(x=>x.id===id):kind==='group'?d.groups.find(x=>String(x.id)===id):d.chats.find(x=>String(x.id)===id);active={kind,id};$('#headName').textContent=x.name;$('#headSub').textContent=x.user?'@'+x.user:x.members.length+' участников';$('#headAvatar').textContent=x.name[0];$('#composer').classList.toggle('on',kind!=='channel');kind==='channel'?channel(x):conversation(x);mobileOpen()}
