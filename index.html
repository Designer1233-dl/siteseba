function setReply(m){replyingTo=m;$('#replyBar span').textContent='Ответ на: '+(m.text||'🖼 Изображение');$('#replyBar').classList.remove('hide');$('#message').focus()}function clearReply(){replyingTo=null;$('#replyBar').classList.add('hide');$('#replyBar span').textContent=''}$('#cancelReply').onclick=clearReply;function replyHtml(m,all){if(!m.replyTo)return '';let q=all.find(x=>x.id===m.replyTo);return '<div class="replyQuote">↩ '+esc(q?(q.text||'🖼 Изображение'):'Исходное сообщение')+'</div>'}function imageHtml(m){if(!m.image)return '';if(m.viewOnce&&m.viewedAt)return '<div class="onceImage">◉ Изображение уже просмотрено</div>';if(m.viewOnce&&!m.mine)return `<button class="onceImage" data-view="${m.id}">◉ Открыть один раз</button>`;return `<img class="chatImage" src="${m.image}" alt="Изображение">`}async function loadMessages(){if(!active)return;try{let v=await api('/api/messages?with='+encodeURIComponent(active));$('#headName').innerHTML=esc(v.user.name)+(v.user.verified?'<span class="verified">●</span>':'');$('#headSub').textContent='@'+v.user.username;$('#headAvatar').innerHTML=v.user.avatar?`<img src="${v.user.avatar}">`:esc(v.user.name[0]);$('#messages').innerHTML=v.messages.length?'<div class="day">Сегодня</div>'+v.messages.map(m=>`<div class="bubble ${m.mine?'me':''}" data-message="${m.id}">${replyHtml(m,v.messages)}${imageHtml(m)}${esc(m.text)}<span class="bubbleMeta">${new Date(m.createdAt).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}${m.mine?' '+(m.readAt?'✓✓':'✓'):''}</span></div>`).join(''):'<div class="emptyChat">Начало общения</div>';$$$$('.bubble[data-message]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-view]'))return;let m=v.messages.find(x=>x.id===b.dataset.message);if(m)setReply(m)});$$$$('[data-view]').forEach(b=>b.onclick=async()=>{let m=v.messages.find(x=>x.id===b.dataset.view);if(!m)return;let opened=await api('/api/messages/'+m.id+'/view',{method:'POST'});b.outerHTML=`<img class="chatImage" src="${opened.image}" alt="Одноразовое изображение">`;setTimeout(loadMessages,5000)});$('#messages').scrollTop=$('#messages').scrollHeight}catch(x){toast(x.message)}}$('#composer').onsubmit=async e=>{e.preventDefault();let input=$('#message'),text=input.value.trim();if((!text&&!pendingImage)||!active)return;input.value='';let image=pendingImage,onceFlag=viewOnce,replyId=replyingTo?.id||null;pendingImage='';viewOnce=false;clearReply();$('#once').classList.remove('onceOn');let optimistic=document.createElement('div');optimistic.className='bubble me';optimistic.innerHTML=esc(text)+'<span class="bubbleMeta">отправка…</span>';$('#messages').appendChild(optimistic);$('#messages').scrollTop=$('#messages').scrollHeight;try{await api('/api/messages',{method:'POST',body:JSON.stringify({to:active,text,image,viewOnce:onceFlag,replyTo:replyId})});await loadMessages();await syncDialogs()}catch(x){optimistic.querySelector('.bubbleMeta').textContent='не отправлено';input.value=text;pendingImage=image;viewOnce=onceFlag;if(replyId){replyingTo={id:replyId,text:'Исходное сообщение'};$('#replyBar span').textContent='Ответ на сообщение';$('#replyBar').classList.remove('hide')}toast(x.message)}};
function notifyIncoming(messages,user){let p=JSON.parse(localStorage.getItem(PK)||'{}');let incoming=messages.filter(m=>!m.mine&&m.createdAt>lastNotified);if(!incoming.length)return;lastNotified=Math.max(...incoming.map(m=>m.createdAt));if(p.notifications===false||!('Notification'in window)||Notification.permission!=='granted'||document.visibilityState==='visible')return;let m=incoming[incoming.length-1];new Notification(user.name,{body:m.image?'Отправил(а) изображение':m.text,icon:user.avatar||undefined})}async function startEvents(){if(eventRunning||!token)return;eventRunning=true;while(eventRunning&&token){try{let v=await api('/api/events?since='+eventCursor);eventCursor=v.cursor||eventCursor;if(v.changed){let dv=await api('/api/conversations'),pme=JSON.parse(localStorage.getItem(PK)||'{}'),incoming=dv.conversations.filter(x=>x.last.from!==pme.id&&x.last.createdAt>lastNotified);if(incoming.length)notifyIncoming([{...incoming[0].last,mine:false}],incoming[0].user);if(active)await loadMessages();await syncDialogs()}}catch(x){if(x.message==='Нужно войти'){logout();return}await new Promise(r=>setTimeout(r,1000))}}}function logout(){token='';eventRunning=false;localStorage.removeItem(TK);localStorage.removeItem(PK);location.reload()}$('#refresh').onclick=async()=>{await syncDialogs();if(active)await loadMessages();toast('Обновлено')};function modal(html){let l=document.createElement('div');l.className='modalLayer';l.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(l);l.onclick=e=>{if(e.target===l)l.remove()};l.querySelector('.close')?.addEventListener('click',()=>l.remove());return l}function adminPanel(){let l=modal('<div class="modalHead"><h2>Админ-раздел</h2><button class="close">×</button></div><div class="adminTabs"><button class="on" data-tab="verify">Верификация</button><button data-tab="pin">Закрепление</button><button data-tab="messages">Сообщения</button></div><section class="adminPane on" data-pane="verify"><div class="adminGrid"><select class="vtype"><option value="user">Пользователь</option><option value="channel">Канал</option><option value="group">Группа</option></select><input class="vuser" placeholder="username без @"></div><div class="adminActions"><button class="primary verifyOn">Выдать</button><button class="danger verifyOff">Снять</button></div><div class="adminState vstate"></div></section><section class="adminPane" data-pane="pin"><div class="adminGrid"><select class="ptype"><option value="user">Пользователь</option><option value="channel">Канал</option><option value="group">Группа</option></select><input class="puser" placeholder="username без @"></div><div class="adminActions"><button class="primary pinOn">Закрепить для всех</button><button class="danger pinOff">Убрать закрепление</button></div><div class="adminState pstate"></div></section><section class="adminPane" data-pane="messages"><button class="primary reloadAudit">Обновить сообщения</button><div class="audit">Загрузка…</div></section>');l.querySelector('.modal').classList.add('adminModal');l.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{l.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));l.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('on',x.dataset.pane===b.dataset.tab));if(b.dataset.tab==='messages')loadAudit(l)});async function verify(enabled){try{let v=await api('/api/admin/verify',{method:'POST',body:JSON.stringify({type:l.querySelector('.vtype').value,username:l.querySelector('.vuser').value,enabled})});l.querySelector('.vstate').textContent='Верифицировано: '+(v.verifications.map(x=>x.type+': @'+x.username).join(', ')||'нет');toast(enabled?'Верификация выдана':'Верификация снята')}catch(x){toast(x.message)}}l.querySelector('.verifyOn').onclick=()=>verify(true);l.querySelector('.verifyOff').onclick=()=>verify(false);l.querySelector('.pinOn').onclick=async()=>{try{let v=await api('/api/admin/pin',{method:'POST',body:JSON.stringify({type:l.querySelector('.ptype').value,username:l.querySelector('.puser').value})});l.querySelector('.pstate').textContent='Закреплено: '+v.pinned.type+' @'+v.pinned.username;await syncDialogs();toast('Закреплено для всех')}catch(x){toast(x.message)}};l.querySelector('.pinOff').onclick=async()=>{try{await api('/api/admin/pin',{method:'DELETE'});l.querySelector('.pstate').textContent='Ничего не закреплено';await syncDialogs();toast('Закрепление убрано')}catch(x){toast(x.message)}};l.querySelector('.reloadAudit').onclick=()=>loadAudit(l);api('/api/admin/settings').then(v=>{l.querySelector('.vstate').textContent='Верифицировано: '+((v.verifications||[]).map(x=>x.type+': @'+x.username).join(', ')||'нет');l.querySelector('.pstate').textContent=v.pinned?'Закреплено: '+v.pinned.type+' @'+v.pinned.username:'Ничего не закреплено'}).catch(x=>toast(x.message))}async function loadAudit(l){let box=l.querySelector('.audit');box.textContent='Загрузка…';try{let v=await api('/api/admin/messages');box.innerHTML=v.messages.length?v.messages.map(m=>'<div class="auditItem"><small>'+esc(m.from.name)+' (@'+esc(m.from.username)+') → '+esc(m.to.name)+' (@'+esc(m.to.username)+') · '+new Date(m.createdAt).toLocaleString('ru')+(m.readAt?' · прочитано':' · не прочитано')+(m.adminSent?' · отправлено администратором':'')+'</small>'+(m.replyTo?'<div class="replyQuote">↩ Ответ на сообщение</div>':'')+(m.hasImage?'🖼 '+(m.viewOnce?'Одноразовое изображение':'Изображение')+(m.viewedAt?' · просмотрено':'')+'<br>':'')+esc(m.text||'')+'<div class="auditButtons"><button data-admin-reply="'+m.id+'" data-as="from">Ответить от @'+esc(m.from.username)+'</button><button data-admin-reply="'+m.id+'" data-as="to">Ответить от @'+esc(m.to.username)+'</button></div></div>').join(''):'Сообщений пока нет';box.querySelectorAll('[data-admin-reply]').forEach(b=>b.onclick=async()=>{let text=prompt('Текст ответа от имени пользователя:');if(!text?.trim())return;try{await api('/api/admin/messages/reply',{method:'POST',body:JSON.stringify({messageId:b.dataset.adminReply,as:b.dataset.as,text:text.trim()})});toast('Ответ отправлен');await loadAudit(l)}catch(x){toast(x.message)}})}catch(x){box.textContent=x.message}}$('#adminMenu').onclick=adminPanel;$('#fab').onclick=()=>{let l=modal('<div class="modalHead"><h2>Новое</h2><button class="close">×</button></div><button class="choice"><span class="choiceIcon">⌕</span><span><b>Найти человека</b><small>Поиск по уникальному username</small></span></button>');l.querySelector('.choice').onclick=()=>{l.remove();$('#search').focus()}};$('#profile').onclick=()=>{let p=JSON.parse(localStorage.getItem(PK)||'{}'),l=modal(`<div class="modalHead"><h2>Профиль</h2><button class="close">×</button></div><label class="avatarPick">${p.avatar?`<img src="${p.avatar}">`:'＋'}</label><input type="file" hidden accept="image/*"><div class="field"><label>ИМЯ</label><input class="pn" value="${esc(p.name||'')}"></div><div class="field"><label>USERNAME</label><input class="pu" value="${esc(p.username||'')}"></div><label class="notifyRow"><input class="notify" type="checkbox" ${p.notifications!==false?'checked':''}> Показывать уведомления о сообщениях</label><button class="primary save">Сохранить</button><button class="danger logoutBtn" style="width:100%;margin-top:8px">Выйти из аккаунта</button><div class="error"></div>`),file=l.querySelector('[type=file]');l.querySelector('.logoutBtn').onclick=logout;l.querySelector('.avatarPick').onclick=()=>file.click();file.onchange=()=>{if(!file.files[0])return;let r=new FileReader;r.onload=()=>{p.avatar=r.result;l.querySelector('.avatarPick').innerHTML=`<img src="${r.result}">`};r.readAsDataURL(file.files[0])};l.querySelector('.save').onclick=async()=>{try{if(l.querySelector('.notify').checked&&'Notification'in window&&Notification.permission==='default')await Notification.requestPermission();let v=await api('/api/me',{method:'PATCH',body:JSON.stringify({name:l.querySelector('.pn').value,username:l.querySelector('.pu').value,avatar:p.avatar||'',notifications:l.querySelector('.notify').checked})});localStorage.setItem(PK,JSON.stringify(v.user));paintProfile();l.remove()}catch(x){l.querySelector('.error').textContent=x.message}}};$('#attach').onclick=()=>$('#imageFile').click();$('#imageFile').onchange=()=>{let f=$('#imageFile').files[0];if(!f)return;if(f.size>5*1024*1024){toast('Изображение должно быть до 5 МБ');return}let r=new FileReader;r.onload=()=>{pendingImage=r.result;toast('Изображение прикреплено')};r.readAsDataURL(f)};$('#once').onclick=()=>{viewOnce=!viewOnce;$('#once').classList.toggle('onceOn',viewOnce);toast(viewOnce?'Однократный просмотр включён':'Обычное изображение')};$('#profile').addEventListener('click',()=>{let cb=document.querySelector('.notify');if(cb)cb.onchange=async()=>{if(cb.checked&&'Notification'in window&&Notification.permission==='default')await Notification.requestPermission()}});$('#myStory').onclick=()=>toast('Истории появятся в следующем обновлении');paintProfile();validate();if(!token)setMode('register');
</script></body></html>
